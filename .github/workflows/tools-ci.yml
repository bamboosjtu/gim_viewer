name: Windows Tools CI

on:
  push:
    paths:
      - 'tools/**'
      - 'desktop/src/engineering/catalog.json'
      - '.github/workflows/tools-ci.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'tools/**'
      - 'desktop/src/engineering/catalog.json'
      - '.github/workflows/tools-ci.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-safety:
    name: Shared build path safety
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Reject unsafe build paths and preserve previous outputs
        shell: pwsh
        # Negative fixtures intentionally invoke Python with exit 17. A child
        # shell isolates that expected status from GitHub's LASTEXITCODE check.
        run: |
          powershell.exe -NoProfile -File ./tools/tests/build-safety.ps1 -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Shared build safety tests failed' }

  tool:
    name: ${{ matrix.tool }} / onefile + startup
    needs: build-safety
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: [gim_device, gim_element, gim_info]
    env:
      TOOL: ${{ matrix.tool }}
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare workspace temporary directory
        run: |
          New-Item -ItemType Directory -Path .tmp/ci/tools -Force | Out-Null
          "TEMP=$((Resolve-Path .tmp/ci/tools).Path)" >> $env:GITHUB_ENV
          "TMP=$((Resolve-Path .tmp/ci/tools).Path)" >> $env:GITHUB_ENV
          "TMPDIR=$((Resolve-Path .tmp/ci/tools).Path)" >> $env:GITHUB_ENV
      # Engineering sample tests and frozen sample smoke are developer-local.
      - name: Install the tool's pinned build dependencies
        run: |
          python -m pip --isolated install --disable-pip-version-check --index-url https://pypi.org/simple --no-cache-dir --only-binary :all: -r "tools/$env:TOOL/requirements-build.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Tool dependency installation failed' }
      - name: Run pure Python contracts without model samples
        run: |
          python -m unittest discover -s "tools/$env:TOOL/tests" -p test_pure.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Pure Python contracts failed' }
      - name: Build and startup-check the actual onefile EXE
        run: |
          & "./tools/$env:TOOL/build.ps1" -Python (Get-Command python).Source -NoVenv -Publish
      - name: Upload tested onefile EXE
        uses: actions/upload-artifact@v7
        with:
          path: tools/${{ matrix.tool }}/dist/*.exe
          archive: false
          overwrite: true
          retention-days: 7
          if-no-files-found: error
