name: Windows Desktop CI

on:
  push:
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'packages/**'
      - 'crates/**'
      - 'contracts/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'eslint.config.mjs'
      - '.github/action-versions.json'
      - '.github/scripts/**'
      - '.github/workflows/**'

  pull_request:
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'packages/**'
      - 'crates/**'
      - 'contracts/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'eslint.config.mjs'
      - '.github/action-versions.json'
      - '.github/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  frontend-and-rust:
    name: Frontend + Tauri Rust checks
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked Android plugin build outputs
        shell: pwsh
        working-directory: .
        run: |
          $tracked = @(git ls-files -- ':(glob)crates/**/android/build/**')
          if ($LASTEXITCODE -ne 0) { throw 'git ls-files failed' }
          if ($tracked.Count -gt 0) {
            $tracked | ForEach-Object { Write-Host $_ }
            throw "Android plugin build outputs must not be tracked ($($tracked.Count) files)"
          }

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            packages/gim-sdk/package-lock.json
            packages/powerline-core/package-lock.json
            app/package-lock.json

      - name: Prepare workspace temporary directory
        run: |
          New-Item -ItemType Directory -Path ../tmp/ci -Force | Out-Null
          "TEMP=$((Resolve-Path ../tmp/ci).Path)" >> $env:GITHUB_ENV
          "TMP=$((Resolve-Path ../tmp/ci).Path)" >> $env:GITHUB_ENV
          "TMPDIR=$((Resolve-Path ../tmp/ci).Path)" >> $env:GITHUB_ENV

      - name: Check GitHub Actions workflow contracts
        working-directory: .
        run: |
          node --test .github/scripts/check-action-versions.test.mjs .github/scripts/android-ci.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-action-versions.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Install SDK dependencies
        run: npm ci --prefix ../packages/gim-sdk

      - name: Install shared line package dependencies
        working-directory: packages/powerline-core
        run: npm ci

      - name: Install Android frontend dependencies for typed lint
        run: npm ci --prefix ../app

      - name: Resolve incremental gate base
        working-directory: .
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $base = $env:EVENT_BASE
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $base = git rev-parse --verify 'HEAD^'
          } elseif (!$base -or $base -match '^0+$') {
            $base = git merge-base HEAD "refs/remotes/origin/$env:DEFAULT_BRANCH"
          }
          if ($LASTEXITCODE -or $base -notmatch '^[0-9a-f]{40}$') {
            throw 'Could not resolve the baseline for the format and Rust gates'
          }
          git cat-file -e "$base^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            # After an amend the previous push tip may be absent from all checked-out refs.
            git fetch --no-tags --depth=1 origin $base
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch baseline commit $base" }
            git cat-file -e "$base^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "Baseline commit $base is unavailable" }
          }
          "GIM_FORMAT_BASE=$base" >> $env:GITHUB_ENV

      - name: Build and consume the standalone SDK
        run: |
          npm run test:sdk

      - name: Run recognition DTOs and adapters
        run: npm run test:recognition

      - name: Check engineering catalogs and standalone copies
        run: npm run check:engineering-catalog

      - name: Check desktop release versions
        run: npm run test:version

      - name: Check generated native v1 contracts
        run: npm run test:native-contracts

      # Cheap, sample-free contracts fail before native compilation and coverage.
      # docs/performance/gates.md: real-sample performance decisions remain manual/local.
      - name: Check measurement value and protocol contracts (no model samples)
        run: npm run test:measurement-tools

      - name: Test measurement core contracts
        run: npm test -- ../packages/measurement-core/src

      - name: Check native acceptance tooling
        run: npm run test:acceptance-tools

      - name: Check local registry protocol (no model samples)
        run: npm run test:local-contract

      - name: Check engineering layer boundaries
        run: npm run check:engineering-boundaries

      - name: Test architecture boundary checks
        run: npm run test:presentation-boundaries

      - name: Check frontend types
        run: npm run check:types

      - name: Run frontend lint
        run: npm run lint

      - name: Check adopted module formatting
        run: npm run check:format

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependency downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-downloads-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'app/src-tauri/Cargo.lock', 'crates/gim-native-core/Cargo.lock') }}

      - name: Check changed Rust formatting and Clippy
        run: npm run check:rust

      - name: Run native library tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path ../crates/gim-native-core/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path ../app/src-tauri/Cargo.toml --lib --locked

      - name: Run frontend unit tests with pure-layer coverage gates
        run: npm run test:coverage

      - name: Run SQLite integration tests
        run: npm run test:sqlite

      - name: Build frontend
        env:
          VITE_GIM_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Check Tauri Rust boundary
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      # The portable build is intentionally manual-only.  It reuses the same
      # Tauri wrapper, fixed WebView2 preparation and package-portable hook as
      # the product build; ordinary pushes/PRs do not spend time uploading a
      # 250MB+ runtime artifact.
      - name: Build Windows portable benchmark artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          VITE_GIM_COMMIT: ${{ github.sha }}
          GIM_BUILD_COMMIT: ${{ github.sha }}
          GIM_BUILD_MODE: benchmark
        run: npm run tauri:build

      - name: Validate portable benchmark artifact
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          $portableRoot = Join-Path $PWD 'src-tauri/target/release/bundle/portable'
          $zipFiles = @(Get-ChildItem -LiteralPath $portableRoot -Filter '*.zip' -File)
          if ($zipFiles.Count -ne 1) {
            throw "Expected exactly one portable ZIP under $portableRoot, found $($zipFiles.Count)"
          }

          $zip = $zipFiles[0]
          $packageDir = Join-Path $portableRoot ([IO.Path]::GetFileNameWithoutExtension($zip.Name))
          $exePath = Join-Path $packageDir 'GIM-Reader.exe'
          $runtimeDir = Join-Path $packageDir 'webview2-fixed-runtime'
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "Portable executable missing: $exePath"
          }
          foreach ($requiredRuntimeFile in @('msedgewebview2.exe', 'msedge.dll', 'icudtl.dat', 'resources.pak')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtimeDir $requiredRuntimeFile) -PathType Leaf)) {
              throw "Fixed WebView2 Runtime file missing: $requiredRuntimeFile"
            }
          }

          $manifestPath = Join-Path $packageDir 'portable-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Portable manifest missing: $manifestPath"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.commit -ne $env:EXPECTED_COMMIT) {
            throw "Portable manifest commit mismatch: expected $env:EXPECTED_COMMIT, got $($manifest.commit)"
          }
          if ($manifest.buildMode -ne 'benchmark' -or $manifest.portable -ne $true) {
            throw 'Portable manifest is not marked as a benchmark portable build'
          }
          if ($manifest.webview2.mode -ne 'fixedRuntime') {
            throw 'Portable manifest does not declare fixed WebView2 Runtime'
          }

          $shaPath = "$($zip.FullName).sha256"
          if (-not (Test-Path -LiteralPath $shaPath -PathType Leaf)) {
            throw "Portable ZIP checksum missing: $shaPath"
          }

          $expectedHash = ((Get-Content -LiteralPath $shaPath -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash
          if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$' -or $expectedHash -ne $actualHash) {
            throw 'Portable ZIP checksum mismatch'
          }

          # Validate the uploaded ZIP itself, not just its source directory.
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $prefix = [IO.Path]::GetFileNameWithoutExtension($zip.Name)
            foreach ($entry in @('GIM-Reader.exe', 'portable-manifest.json', '使用说明.txt',
                'webview2-fixed-runtime/msedgewebview2.exe', 'webview2-fixed-runtime/msedge.dll',
                'webview2-fixed-runtime/icudtl.dat', 'webview2-fixed-runtime/resources.pak')) {
              $archived = $archive.GetEntry("$prefix/$entry")
              if ($null -eq $archived -or $archived.Length -eq 0) {
                throw "Portable ZIP entry missing or empty: $entry"
              }
            }
            $reader = [IO.StreamReader]::new($archive.GetEntry("$prefix/portable-manifest.json").Open())
            try { $archivedManifest = $reader.ReadToEnd() | ConvertFrom-Json }
            finally { $reader.Dispose() }
            if ($archivedManifest.commit -ne $env:EXPECTED_COMMIT -or $archivedManifest.buildMode -ne 'benchmark') {
              throw 'Portable ZIP manifest does not match this benchmark build'
            }
          } finally { $archive.Dispose() }

          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $PWD 'benchmark-build-manifest.json') -Encoding utf8
          Write-Host "Validated portable benchmark artifact: $($zip.Name)"

      - name: Upload Windows portable benchmark artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: gim-viewer-windows-portable-benchmark-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/portable/*.zip
            desktop/src-tauri/target/release/bundle/portable/*.zip.sha256
            desktop/benchmark-build-manifest.json
