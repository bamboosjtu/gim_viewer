<!doctype html><meta charset="utf-8"><title>单钢结构产品 LOD 验证</title>
<style>body{margin:0;font:15px system-ui}header{height:50px;display:flex;align-items:center;gap:12px;padding:0 18px}button{padding:8px}#scene{height:800px;width:100vw}#status{position:absolute;top:60px;left:20px;background:#fff;padding:12px;z-index:3;max-width:650px}</style>
<header><b>单钢结构 · 产品 Fragments / 区域 LOD</b><button id="near">近景连接板</button><button id="far">远景</button><button id="again">缓存重新打开</button></header><div id="status">加载引擎…</div><div id="scene"></div>
<script type="module">
import * as T from '/node_modules/.vite/deps/three.js';
import {AppState} from '/src/app/state.ts';import {createViewerEngine} from '/src/viewer/viewerEngine.ts';
import {initEngine,registerModelEvents} from '/src/viewer/ifcLoader.ts';import {loadBimIfc} from '/src/viewer/ifcBimLoader.ts';
const state=new AppState(),ctx=createViewerEngine(document.querySelector('#scene')),status=document.querySelector('#status');
localStorage.setItem('gim-ifc-detail-mode','far');state.currentProjectType='substation';
await initEngine(ctx,state);registerModelEvents(ctx,state,{onModelAdded(){},onModelRemoved(){}});
const sourcePath='CBM/0302-钢结构.ifc',logical='steel-product',sha='71d5d31cdddbf01f336864cc6d13a469ce07efa475e175f2f7b7ec65df679605';
const read=async()=>new Uint8Array(await(await fetch('http://127.0.0.1:14332/source.ifc')).arrayBuffer());
let farBox,model,session;
async function far(){localStorage.setItem('gim-ifc-detail-mode','far');window.dispatchEvent(new Event('gim-ifc-detail-mode'));const c=farBox.getCenter(new T.Vector3()),s=farBox.getSize(new T.Vector3()),d=s.length();await ctx.world.camera.controls.setLookAt(c.x+d*.6,c.y+d*.6,c.z+d*.8,...c.toArray(),false);await ctx.fragments.core.update(true);}
async function open(){const started=performance.now();window.__steelLod={state,ctx,status:'loading',sourceReads:0};session=state.activateProject(0,sha);const runtime=state.getRuntimeModelId(logical,session);state.registerIfcRuntimeModel(logical,runtime,session);
 model=await loadBimIfc(ctx,state,session,runtime,logical,sourcePath,()=>{window.__steelLod.sourceReads++;return read();},p=>{status.textContent=`远景转换 ${Math.round(p*100)}%`;});
 if(!model)throw Error('No model');const ids=await model.getItemsIdsWithGeometry();farBox=await model.getMergedBox(ids);await far();
 const categories=await model.getItemsWithGeometryCategories();window.__steelLod={...window.__steelLod,status:'far',model,regional:state.ifcRegionalRuntimes.get(logical),farMs:performance.now()-started,cacheHit:model.object.userData.ifcLodCacheHit,farGeometryObjects:ids.length,fastenerGeometry:categories.filter(v=>/fastener/i.test(v??'')).length};status.textContent=JSON.stringify({farMs:window.__steelLod.farMs,cacheHit:window.__steelLod.cacheHit,farGeometryObjects:ids.length,fastenerGeometry:window.__steelLod.fastenerGeometry});}
document.querySelector('#near').onclick=async()=>{const a=window.__steelLod,r=a.regional,o=r.index.objects.find(o=>o.expressId===71558);if(!o)throw Error('Plate missing');const base=await model.getCoordinationMatrix(),m=base.clone();const box=new T.Box3(new T.Vector3().fromArray(o.bounds),new T.Vector3().fromArray(o.bounds,3)).applyMatrix4(m),c=box.getCenter(new T.Vector3()),s=box.getSize(new T.Vector3()),values=s.toArray(),axis=values.indexOf(Math.min(...values));const normal=new T.Vector3().setComponent(axis,1),p=c.clone().addScaledVector(normal,Math.max(1,s.length()*1.3));
 localStorage.setItem('gim-ifc-detail-mode','auto');await ctx.world.camera.controls.setLookAt(...p.toArray(),...c.toArray(),false);window.dispatchEvent(new Event('gim-ifc-detail-mode'));a.nearStarted=performance.now();a.status='near';};
document.querySelector('#far').onclick=far;
document.querySelector('#again').onclick=async()=>{state.invalidatePendingLoads();for(const id of [...ctx.fragments.list.keys()])ctx.fragments.core.disposeModel(id);state.loadedModels.clear();await open();};
setInterval(()=>{const a=window.__steelLod;if(a?.status==='near')status.textContent=JSON.stringify(a.regional.diagnostics);},1000);
open().catch(e=>{status.textContent=String(e);window.__steelLod.error=String(e);});
</script>
