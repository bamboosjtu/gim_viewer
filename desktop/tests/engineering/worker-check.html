<!doctype html>
<meta charset="utf-8">
<title>Engineering worker integration check</title>
<p>Isolated functional check of actual Workers, source extraction and cache transport.</p>
<script type="module">
import {EngineeringWorkerClient} from '../../src/services/engineeringWorkerClient.ts';
import {beginEngineeringBuild} from '../../src/services/engineeringService.ts';
import {AppState} from '../../src/app/state.ts';

globalThis.runEngineeringWorkerCheck = async () => {
  const check = (condition, message) => {if (!condition) throw Error(message);};
  const files = new Map([
    ['project.cbm',new File(['ENTITYNAME=F2System\nOBJECTMODELPOINTER=main.dev'],'project.cbm')],
    ['main.dev',new File(['SYMBOLNAME=主变压器\nSUBDEVICE0=terminal.dev\nSUBDEVICE1=radiator.dev'],'main.dev')],
    ['terminal.dev',new File(['SYMBOLNAME=本体端子箱'],'terminal.dev')],
    ['radiator.dev',new File(['SYMBOLNAME=散热器'],'radiator.dev')],
    ['unreferenced.fam',new File([new Uint8Array([0x81])],'unreferenced.fam')],
  ]);
  const scope='a'.repeat(64),identity={sourceSha256:scope,parserVersion:'browser-worker-check',entries:[...files.keys()]};
  const client=EngineeringWorkerClient.create(()=>true);
  let sourceBytes,entityBytes,navigationBytes,expected,expectedNavigation;
  try {
    await client.init(scope,[...files.keys()]);
    await client.addFiles([...files].map(([path,blob])=>({path,blob})));
    const graph=await client.extract();check(graph.sourceRecords===3,'actual Worker source extraction summary');
    check(!('records' in graph),'extraction does not clone the full graph into the Window');
    check(client.geometryOccurrences?.occurrences.length===1,'independent physical occurrence contract');
    const result=await client.assemble([],[],identity);
    check(result.sources.complete&&result.snapshot.entities.length===1,'transformer includes its embedded terminal box');
    check(result.snapshot.memberships.length===3,'source conservation');
    check(!('sourceBytes' in result)&&result.cachePlan.join(',')==='sources,entities,navigation','display-first transport has no cache bodies');
    const caches={};
    for(const domain of result.cachePlan){const artifact=await client.encodeCache(result.buildId,domain);check(artifact.bytes?.length&&!artifact.error,'deferred '+domain+' cache');caches[domain]=artifact.bytes;}
    sourceBytes=caches.sources;entityBytes=caches.entities;navigationBytes=caches.navigation;expected=result.snapshot;expectedNavigation=result.navigation;
  } finally {client.close();}
  const warm=EngineeringWorkerClient.create(()=>true);
  try {
    const restored=await warm.restore(sourceBytes.slice(),entityBytes.slice(),identity,navigationBytes.slice());
    check(restored.entityCacheHit===true,'warm entity cache hit');
    check(JSON.stringify(restored.snapshot)===JSON.stringify(expected),'cold/warm snapshot equivalence');
    check(restored.navigationCacheHit===true&&restored.navigation.composition.nodes.size===expectedNavigation.composition.nodes.size,'warm navigation cache hit');
  } finally {warm.close();}
  const repair=EngineeringWorkerClient.create(()=>true);
  try {
    const restored=await repair.restore(sourceBytes.slice(),new Uint8Array([1,2,3]),identity);
    check(restored.entityCacheHit===false&&(await repair.encodeCache(restored.buildId,'entities')).bytes?.length,'entity-only repair');
    check(JSON.stringify(restored.snapshot)===JSON.stringify(expected),'repair does not change engineering boundaries');
  } finally {repair.close();}
  const binary=EngineeringWorkerClient.create(()=>true);
  try {
    const chunks=await Promise.all([...files].map(async([path,file])=>({path,bytes:new Uint8Array(await file.arrayBuffer())})));
    const joined=new Uint8Array(chunks.reduce((sum,part)=>sum+part.bytes.length,0));let offset=0;
    const shared=chunks.map(part=>{joined.set(part.bytes,offset);const bytes=joined.subarray(offset,offset+part.bytes.length);offset+=part.bytes.length;return {path:part.path,bytes};});
    await binary.init(scope,[...files.keys()]);await binary.addFiles(shared);
    check(joined.byteLength===0,'native batch buffer ownership transfer');
    await binary.extract();
    const result=await binary.assemble([],[]);
    check(JSON.stringify(result.snapshot)===JSON.stringify(expected),'shared native binary batch');
  } finally {binary.close();}
  const controller=new AbortController(),cancel=EngineeringWorkerClient.create(()=>true,controller.signal);
  const obsolete=cancel.init(scope,[...files.keys()]).then(()=>false,error=>error.name==='AbortError');
  controller.abort();check(await obsolete,'actual Worker cancellation');
  const state=new AppState();state.activateProject(7,scope);
  await beginEngineeringBuild(state,files);
  check(state.engineeringStatus==='ready'&&state.engineeringSnapshot.entities.length===1,'production service with actual Worker');
  const fixture=document.createElement('section');fixture.innerHTML='<div id="cbm-tree-panel" class="tab-panel"></div><aside id="props-drawer"><div id="props-drawer-body"></div></aside><button id="btn-close-props"></button><button id="btn-export-props"></button>';
  document.body.append(fixture);state.currentProjectType='substation';state.engineeringNavMode='composition';
  const {configurePresentation}=await import('../../src/app/presentationBindings.ts');configurePresentation();
  const {renderEngineeringTree}=await import('../../src/ui/engineeringTreeView.ts');renderEngineeringTree(state);
  check([...fixture.querySelectorAll('.substation-nav-mode-btn')].map(b=>b.textContent).join(',')==='清册,工程,来源','actual browser three views');
  check(state.engineeringNavigation.inventory.rowsBySource.size===3,'inventory includes actual component sources');
  const input=fixture.querySelector('[role="combobox"]');input.value='散热器';input.dispatchEvent(new Event('input'));
  fixture.querySelector('[role="option"]').click();check(state.selectionRequest.target.kind==='engineering','search claims whole selection before lazy imports');
  const until=async(predicate,label)=>{const end=performance.now()+10000;while(!predicate()){if(performance.now()>end)throw Error(`browser navigation did not settle: ${label}`);await new Promise(resolve=>setTimeout(resolve,25));}};
  await until(()=>fixture.querySelector('.props-header')?.textContent==='主变压器','search whole');
  [...fixture.querySelectorAll('[data-engineering-source-index]')].find(b=>b.textContent==='散热器').click();
  try { await until(()=>state.engineeringNavMode==='source'&&fixture.querySelector('.props-header')?.textContent==='散热器','source reveal'); }
  catch(error){throw Error(`${error.message}; mode=${state.engineeringNavMode}; header=${fixture.querySelector('.props-header')?.textContent}; sourceButtons=${[...fixture.querySelectorAll('[data-engineering-source-index]')].map(b=>b.textContent).join('|')}`);}
  check(fixture.querySelector('.tree-row.selected')?.textContent.includes('散热器'),'source reveal in virtual outline');
  fixture.querySelector('#engineering-owner').click();
  await until(()=>state.engineeringNavMode==='composition'&&fixture.querySelector('.props-header')?.textContent==='主变压器','owner return');
  const {buildSubstationSpatialIndexInWorker}=await import('../../src/services/substationSpatialWorkerClient.ts');
  let spatialCache;
  const spatial=await buildSubstationSpatialIndexInWorker(new Map([['model.ifc',new File(["#1=IFCPROJECT('p',$,'工程',$,$,$,$,$,$);\n#2=IFCWALL('w',$,'墙',$,$,$,$,$);"],'model.ifc')]]),
    [{path:'model.ifc',name:'model',modelId:'model'}],null,[],{},()=>true,{metadata:{sourceSha256:scope},onEncoded:value=>{spatialCache=value;}});
  check(!spatialCache?.error&&spatialCache?.bytes?.byteLength>0,'Spatial Worker cache encoding');
  const spatialSnapshot=JSON.parse(new TextDecoder().decode(spatialCache.bytes));
  check(spatialSnapshot.sourceSha256===scope&&JSON.stringify(spatialSnapshot.objects)===JSON.stringify(spatial.objects),'Spatial cache source identity and index equivalence');
  state.invalidatePendingLoads();
  fixture.remove();
  return {passed:true,scope:'functional fixture; excludes native IPC, real samples, geometry and performance acceptance',userAgent:navigator.userAgent,
    checks:['source graph','physical occurrence contract','whole boundary','source conservation','cache transport','warm restore','navigation projection/cache','entity-only repair','shared binary buffer','Worker abort','production service','browser whole search/source round trip','Spatial cache Worker encoding']};
};
</script>
