<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIM BIM 浏览器</title>
    <link rel="stylesheet" href="/src/ui/app.css">
  </head>
  <body>
    <div id="app">
      <!-- 顶部项目栏 -->
      <header id="topbar">
        <div class="brand"><span class="brand-mark"></span><span>GIM BIM 浏览器</span></div>
        <div class="project-select">
          <span id="project-title">未打开工程</span>
          <span class="caret">⌄</span>
        </div>
        <span id="project-type-badge" class="badge hidden"></span>
        <div class="top-spacer"></div>
        <button id="btn-ifc-opening-policy" class="top-action top-overflow" aria-pressed="true" title="远景省略关系开洞与螺栓；自动模式仅恢复相机附近30m范围内的中型开洞和螺栓。">IFC 细节：自动（近景30m）</button>
        <button id="btn-load-gim" class="top-action primary">打开 GIM</button>
        <input id="gim-file-input" class="hidden-input" type="file" accept=".gim" />
        <button id="btn-load-local" class="top-action top-overflow">附加 IFC</button>
        <input id="file-input" class="hidden-input" type="file" accept=".ifc" multiple />
        <button id="btn-clear" class="top-action">关闭工程</button>
        <button id="btn-cache-manager" class="top-action top-overflow" title="缓存管理">缓存</button>
        <div id="more-menu-anchor">
          <button id="btn-more" class="top-action more-trigger" aria-expanded="false" aria-controls="more-menu">更多 ▾</button>
          <div id="more-menu" role="menu" hidden>
            <button id="menu-attach-ifc" role="menuitem">附加 IFC…</button>
            <button id="menu-cache" role="menuitem">缓存管理…</button>
            <button id="menu-ifc-detail" role="menuitem">IFC 细节设置…</button>
            <button id="menu-previous-view" role="menuitem" hidden>上一视角</button>
            <button id="menu-only-selected" role="menuitem" hidden>仅看选中</button>
            <button id="menu-show-all" role="menuitem" hidden>恢复全站</button>
            <button id="menu-station-overview" role="menuitem">恢复整站远景</button>
            <button id="menu-settings" role="menuitem">设置…</button>
            <div class="menu-sep" role="separator"></div>
            <label class="menu-check"><input id="menu-auto-open-last" type="checkbox" /> 启动时恢复上次工程</label>
            <label class="menu-check"><input id="menu-show-props" type="checkbox" /> 选择对象时展开属性</label>
            <div class="menu-sep" role="separator"></div>
            <div class="menu-recent-title">最近工程</div>
            <div id="menu-recent-projects" class="menu-recent"></div>
          </div>
        </div>
      </header>

      <!-- 主区 -->
      <div id="main">
        <!-- 工作区导航轨 -->
        <nav id="workspace-rail" aria-label="工作区">
          <button class="rail-item active" data-tab="tab-tree" title="模型层级">
            <span class="rail-icon">▦</span><span>模型</span>
          </button>
          <button class="rail-item" data-tab="tab-filedev" title="文件与设备">
            <span class="rail-icon">⚙</span><span>设备</span>
          </button>
          <button class="rail-item" data-tab="tab-models" title="模型列表与图层">
            <span class="rail-icon">▤</span><span>图层</span>
          </button>
          <button class="rail-item" data-tab="tab-sld" title="电气单线图">
            <span class="rail-icon">⚡</span><span>图纸</span>
          </button>
        </nav>

        <!-- 导航器 -->
        <aside id="navigator">
          <div class="panel-head"><h2 id="navigator-title">模型</h2><span class="panel-count" id="navigator-count"></span></div>
          <div id="tab-tree" class="tab-panel active">
            <div id="cbm-tree-panel"></div>
          </div>
          <div id="tab-filedev" class="tab-panel">
            <div id="file-dev-panel"></div>
          </div>
          <div id="tab-models" class="tab-panel">
            <div id="model-list"></div>
          </div>
          <div id="tab-sld" class="tab-panel">
            <div id="sld-panel"></div>
          </div>
        </aside>

        <!-- 中央视口 -->
        <div id="center">
          <div id="viewport">
            <div id="loading">
              <div class="loading-line">
                <span id="loading-text">准备中...</span>
                <span id="loading-elapsed"></span>
              </div>
              <div class="loading-track"><i id="loading-bar"></i></div>
              <div class="loading-line"><span id="loading-stage">准备中</span></div>
            </div>
            <div id="empty-tip">
              <div class="empty-skeleton" aria-hidden="true"></div>
              <div class="empty-content">
                <h2>尚未打开工程</h2>
                <p>打开 GIM 开始浏览；支持变电、线路与独立设备模型</p>
                <div class="welcome-actions">
                  <button id="btn-welcome-open" class="btn">打开 GIM</button>
                  <button id="btn-welcome-continue" class="btn btn-secondary">继续上次工程</button>
                </div>
                <div id="recent-projects" class="recent-projects"></div>
              </div>
            </div>
            <div id="sld-overlay" class="sld-overlay" aria-hidden="true">
              <div class="sld-overlay-header">
                <span class="sld-overlay-title">一次图 · 主接线图</span>
                <span class="sld-overlay-hint">叠加显示，三维模型保持加载</span>
                <span class="sld-overlay-spacer"></span>
                <button id="sld-overlay-close" class="sld-overlay-close" type="button">关闭叠加</button>
              </div>
              <div id="sld-overlay-content" class="sld-overlay-content"></div>
            </div>
          </div>
        </div>

        <!-- 右侧对象检查器 -->
        <aside id="props-drawer" class="collapsed">
          <div id="props-drawer-header">
            <h3>属性</h3>
            <div class="header-actions">
              <button id="btn-export-props" class="icon-btn" title="导出属性 CSV">⇩</button>
              <button id="btn-close-props" class="icon-btn" title="收起">✕</button>
            </div>
          </div>
          <div id="props-drawer-body">
            <div class="props-empty">选择层级树节点查看属性</div>
          </div>
        </aside>
      </div>

      <!-- 底部状态栏 -->
      <footer id="status-bar">
        <div class="status-left"><span id="status-dot" class="status-dot"></span><span id="status-text" role="status" aria-live="polite">就绪</span></div>
        <div class="status-mid"><span id="status-devices" hidden></span><span id="status-ifc" hidden></span><span id="status-connections" hidden></span><span id="status-publish" class="status-publish" hidden></span><span id="status-selection">未选中</span></div>
        <div class="status-right" id="status-right">GIM BIM 浏览器</div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
